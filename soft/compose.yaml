services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - drakkar-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PROVISIONING_KEY: ${PROVISIONING_KEY:?Set PROVISIONING_KEY in .env}
      RESERVATION_TTL: ${RESERVATION_TTL:-PT15M}
      RESERVATION_SWEEP_MS: ${RESERVATION_SWEEP_MS:-5000}
      SSE_DISPATCH_MS: ${SSE_DISPATCH_MS:-500}
      SSE_HEARTBEAT: ${SSE_HEARTBEAT:-PT15S}
      SSE_CONNECTION_TIMEOUT_MS: ${SSE_CONNECTION_TIMEOUT_MS:-1800000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  drakkar-data:
