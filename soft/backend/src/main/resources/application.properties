spring.application.name=drakkar-erp

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null

server.error.include-message=never

management.endpoints.web.exposure.include=health,info,metrics

info.app.name=Drakkar ERP Soft prototype
info.app.architecture=modular-monolith

drakkar.provisioning-key=${PROVISIONING_KEY}
drakkar.reservations.ttl=${RESERVATION_TTL:PT15M}
drakkar.reservations.sweep-ms=${RESERVATION_SWEEP_MS:5000}
drakkar.events.dispatch-ms=${SSE_DISPATCH_MS:500}
drakkar.events.heartbeat=${SSE_HEARTBEAT:PT15S}
drakkar.events.connection-timeout-ms=${SSE_CONNECTION_TIMEOUT_MS:1800000}
spring.task.scheduling.pool.size=2
