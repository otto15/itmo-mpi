spring:
  application:
    name: drakkar-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/drakkar}
    username: ${DB_USER:drakkar}
    password: ${DB_PASSWORD:drakkar}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

info:
  app:
    name: Drakkar ERP Soft prototype
    architecture: modular-monolith

drakkar:
  provisioning-key: ${PROVISIONING_KEY:local-provisioning-key}
